<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>py//run</title>
  <script>
    // Applied synchronously, before first paint, so a saved light-mode
    // preference doesn't flash dark before the module scripts below run.
    (function () {
      try {
        if (localStorage.getItem('py-run:theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="brand">
      <i data-lucide="square-terminal" class="brandIcon"></i>
      <span class="dot-blue">py</span><span class="dot-yellow">//</span><span>run</span>
    </div>
    <div id="actions">
      <button class="btn iconOnly" id="settingsBtn" title="Settings"><i data-lucide="settings"></i></button>
      <button class="btn" id="downloadBtn" title="Download as main.py"><i data-lucide="download"></i> .py</button>
      <button class="btn" id="clearAllBtn" title="New file"><i data-lucide="file-plus"></i> New</button>
      <button class="btn" id="runBtn" disabled>Loading…</button>
    </div>
  </div>

  <div id="tabstrip">
    <div class="tab">
      <span class="unsaved" id="unsavedDot" style="opacity:0"></span>
      main.py
    </div>
  </div>

  <div id="main">
    <div id="editorPane"><div id="editor"></div></div>
    <div id="divider"></div>
    <div id="consolePane">
      <div id="consoleHeader">
        <span><i data-lucide="square-terminal"></i> Console</span>
        <div class="console-actions">
          <button class="iconBtn" id="copyOutputBtn" title="Copy output to clipboard"><i data-lucide="copy"></i></button>
          <button class="iconBtn" id="clearConsoleBtn" title="Clear console"><i data-lucide="trash-2"></i></button>
        </div>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <div id="statusbar" class="busy">
    <span id="statusText">Booting Python runtime…</span>
    <div class="right">
      <span id="posText">Ln 1, Col 1</span>
      <span id="pythonVersionText"></span>
    </div>
  </div>

</div>

<dialog id="settingsDialog">
  <div class="dialogHeader">
    <h2><i data-lucide="settings"></i> Settings</h2>
    <button type="button" class="iconBtn" id="settingsCloseBtn" title="Close"><i data-lucide="x"></i></button>
  </div>
  <div class="dialogBody">
    <label class="settingRow">
      <div class="settingLabel">
        <span><i data-lucide="sun-moon"></i> Theme</span>
        <span class="settingHint">Switch between dark and light mode</span>
      </div>
      <span class="switch">
        <input type="checkbox" id="themeToggle" />
        <span class="switchTrack"></span>
      </span>
    </label>
    <div class="settingRow">
      <div class="settingLabel">
        <span><i data-lucide="cpu"></i> Python version</span>
        <span class="settingHint">Switching restarts the runtime</span>
      </div>
      <select class="btn" id="pythonVersionSelect" disabled>
        <option value="v0.25.1">Python 3.11</option>
        <option value="v0.27.2">Python 3.12</option>
        <option value="v0.29.3" selected>Python 3.13</option>
        <option value="dev">Python 3.14 (pre-release)</option>
      </select>
    </div>
    <label class="settingRow">
      <div class="settingLabel">
        <span><i data-lucide="sparkles"></i> IntelliSense</span>
        <span class="settingHint">Autocomplete, hover docs &amp; signature help via jedi, running inside Pyodide. Installs on first use.</span>
      </div>
      <span class="switch">
        <input type="checkbox" id="intellisenseToggle" disabled />
        <span class="switchTrack"></span>
      </span>
    </label>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
